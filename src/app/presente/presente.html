<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Parisienne&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">

<div class="bloco-texto">
    <pre><h1 class="fonte-bonita">Tatiane Solcia
&
João Caires</h1></pre> 
    <h2 class="fonte-montserrat">26 • 09 • 2026</h2>
    <h2 class="fonte-montserrat">Lista de Presentes</h2>
</div>

<div class="grid-presentes">
  @for (item of produtos(); track item.titulo) {
    <div class="card-produto">
        <h3 class="titulo">{{ item.titulo }}</h3>
      <img [src]="item.foto" [alt]="item.titulo" class="foto-produto" />
      
      <div class="info-produto">
        <p class="descricao-texto">{{ item.descricao }}</p>
        <span class="preco">{{ item.valor | currency:'BRL' }}</span>
      </div>

      <div class="acoes-produto">
        <button
          class="btn-compra"
          [class.btn-compra-disabled]="item.disabled"
          [attr.aria-disabled]="item.disabled"
          [disabled]="item.disabled && !item.mensagem"
          (click)="comprar(item)"
        >
          <i class="pi pi-shopping-cart"></i> 
          Presentear
        </button>
      </div>
    </div>
  }
</div>
