<div class="countdown">
  <h2>Contagem regressiva para o grande dia:</h2>
  
  <div class="countdown-grid">
    <div class="surface-card p-4 shadow-2 border-round countdown-card">
      <span class="text-4xl font-bold">{{ days }}</span>
      <p class="font-light">Dias</p>
   </div>
   <div class="surface-card p-4 shadow-2 border-round countdown-card">
      <span class="text-4xl font-bold">{{ hours }}</span>
      <p class="font-light">Horas</p>
   </div>
   <div class="surface-card p-4 shadow-2 border-round countdown-card">
      <span class="text-4xl font-bold">{{ minutes }}</span>
      <p class="font-light">Minutos</p>
   </div>
   <div class="surface-card p-4 shadow-2 border-round countdown-card">
      <span class="text-4xl font-bold">{{ seconds }}</span>
      <p class="font-light">Segundos</p>
   </div>
  </div>
</div>
